name: Deploy English Tools Hub to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-tools
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build the English Tools Hub only
        run: node scripts/build-github-pages.mjs
        env:
          PAGES_BASE_PATH: /After-hours
          PAGES_SITE_URL: https://ibrahimbinselimbd.github.io/After-hours
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
