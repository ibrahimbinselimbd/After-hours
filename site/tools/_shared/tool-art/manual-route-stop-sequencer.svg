<title id="title">Manual Route Stop Sequencer — animated tool preview</title><desc id="desc">A function-specific travel scene for Manual Route Stop Sequencer. Create a repeatable stop order from a small manually entered distance matrix using a nearest-next heuristic and show total route distance.</desc>
