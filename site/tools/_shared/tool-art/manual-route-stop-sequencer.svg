<style>@keyframes motion-yq0ary{0%,100%{transform:translateY(4px);opacity:.35}50%{transform:translateY(-4px);opacity:.9}}.motion{animation:motion-yq0ary 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform,opacity}@media(prefers-reduced-motion:reduce){.motion{animation:none!important;will-change:auto}}</style>
